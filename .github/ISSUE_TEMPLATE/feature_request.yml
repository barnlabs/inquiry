name: Feature request
description: Propose a bounded, testable research workflow improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: job
    attributes:
      label: User and research job
      description: Who needs this and what decision or task should become easier?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public sources and verification
      description: Name authoritative free sources, identifiers, licenses, expected failure states, and a public test query.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, safety, and cost boundaries
    validations:
      required: true

