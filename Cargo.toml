[package]
name = "barnlabs-inquiry"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
description = "Local-first, source-grounded public research for humans and agents"
repository = "https://github.com/barnlabs/inquiry"
homepage = "https://barnlabs.net/inquiry"
keywords = ["research", "osint", "mcp", "statistics", "provenance"]
categories = ["command-line-utilities", "science"]
include = [
  "/src/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/SECURITY.md",
  "/THIRD_PARTY_LICENSES.html",
  "/docs/**",
]

[[bin]]
name = "inquiry"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
futures = "0.3"
fs2 = "0.4"
fasteval = { version = "0.2.4", default-features = false }
lopdf = { version = "0.44", default-features = false }
libc = "0.2"
percent-encoding = "2.3"
quick-xml = "0.41"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "io-util", "io-std", "time"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
